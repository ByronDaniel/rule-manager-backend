      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          {
            type: string,
            description: Ruta JSON Pointer o nombre del parámetro.,
          }
        code: { type: string, maxLength: 64 }
        message: { type: string, maxLength: 300 }
    Problem:
      type: object
      description: Error según RFC 9457 (`application/problem+json`).
      required: [type, title, status, businessCode, correlationId]
      properties:
        type:
          {
            type: string,
            format: uri-reference,
            description: URI que identifica el tipo de problema.,
          }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          {
            type: string,
            maxLength: 1000,
            description: Descripción segura para el consumidor.,
          }
        instance:
          {
            type: string,
            format: uri-reference,
            description: URI de la operación o recurso implicado.,
          }
        businessCode:
          type: string
          maxLength: 64
          description: Código de negocio estable (p. ej. MAKER_CHECKER_VIOLATION, INVALID_STATE_TRANSITION, BASE_VERSION_MISMATCH, PARAMETER_PUBLISHED, DUPLICATE_CODE, IDEMPOTENCY_KEY_REUSED, VALUE_OUT_OF_RANGE).
        correlationId: { type: string, minLength: 8, maxLength: 64 }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
      additionalProperties: true
  responses:
    NotModified:
      description: El recurso no cambió respecto de `If-None-Match`. Sin cuerpo.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
    BadRequest:
      description: Solicitud malformada o parámetros inválidos (sintaxis, tipos, límites de paginación).
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.banco.example/problems/validation-error
            title: Solicitud inválida
            status: 400
            detail: El parámetro size debe ser menor o igual a 100.
            businessCode: INVALID_REQUEST
            correlationId: 8f14e45f-ceea-467a
            errors:
              [
                {
                  field: size,
                  code: MAX_EXCEEDED,
                  message: Debe ser menor o igual a 100.,
                },
              ]
    Unauthorized:
      description: Credenciales ausentes, inválidas o expiradas.
      headers:
        WWW-Authenticate: { schema: { type: string } }
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Autenticado sin rol/scope suficiente, o violación de separación de funciones (`MAKER_CHECKER_VIOLATION`).
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.banco.example/problems/maker-checker-violation
            title: Separación de funciones
            status: 403
            detail: El creador de la propuesta no puede aprobarla.
            businessCode: MAKER_CHECKER_VIOLATION
            correlationId: 8f14e45f-ceea-467a
    NotFound:
      description: Recurso inexistente o no visible para el solicitante.
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.banco.example/problems/not-found
            title: Recurso no encontrado
            status: 404
            businessCode: PARAMETER_NOT_FOUND
            correlationId: 8f14e45f-ceea-467a
    Conflict:
      description: Conflicto con el estado actual (código duplicado, transición inválida, versión base desactualizada, parámetro publicado).
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.banco.example/problems/invalid-state-transition
            title: Transición de estado inválida
            status: 409
            detail: La propuesta ya fue resuelta y no puede aprobarse nuevamente.
            businessCode: INVALID_STATE_TRANSITION
            correlationId: 8f14e45f-ceea-467a
    PreconditionFailed:
      description: El ETag de `If-Match` no coincide con la representación actual (concurrencia optimista).
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.banco.example/problems/precondition-failed
            title: Precondición fallida
            status: 412
            detail: El recurso fue modificado. Vuelva a consultarlo.
            businessCode: STALE_ETAG
            correlationId: 8f14e45f-ceea-467a
    PreconditionRequired:
      description: Falta el encabezado `If-Match` requerido.
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableContent:
      description: Sintaxis válida pero contenido semánticamente inválido (valor fuera de rango, tipo distinto de `dataType`, restricciones incompatibles, reutilización de `Idempotency-Key`).
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://api.banco.example/problems/validation-error
            title: Valor no válido
            status: 422
            detail: El valor excede el máximo permitido por las restricciones del parámetro.
            businessCode: VALUE_OUT_OF_RANGE
            correlationId: 8f14e45f-ceea-467a
            errors:
              [
                {
                  field: proposedValue,
                  code: MAX_EXCEEDED,
                  message: Máximo permitido 50000.00.,
                },
              ]
    TooManyRequests:
      description: Límite de tasa excedido (aplicado en el API Gateway).
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Error interno. No expone trazas ni detalles de infraestructura.
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Servicio no disponible temporalmente. Los consumidores deben usar el último valor conocido y reintentar con backoff.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
